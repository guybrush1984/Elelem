scenario: "elelem_dynamic_routing"
description: "Test dynamic routing with UCB algorithm - different providers have different speeds"
type: "conditional"

# This scenario simulates providers with different response times.
# After several requests, the dynamic routing should learn and favor faster providers.
#
# Provider speeds (delay_seconds):
# - fast-provider:   0.1s delay → ~100 tokens/s (10 tokens / 0.1s)
# - medium-provider: 0.3s delay → ~33 tokens/s
# - slow-provider:   0.5s delay → ~20 tokens/s
#
# All return same token counts (10 output tokens) so only speed differs.

conditions:
  # Fast provider - 0.1 second delay
  - check: "model_contains"
    value: "fast-provider"
    response:
      type: "success"
      content: "Response from fast provider"
      delay_seconds: 0.1
      tokens:
        input: 20
        output: 10

  # Medium provider - 0.3 second delay
  - check: "model_contains"
    value: "medium-provider"
    response:
      type: "success"
      content: "Response from medium provider"
      delay_seconds: 0.3
      tokens:
        input: 20
        output: 10

  # Slow provider - 0.5 second delay
  - check: "model_contains"
    value: "slow-provider"
    response:
      type: "success"
      content: "Response from slow provider"
      delay_seconds: 0.5
      tokens:
        input: 20
        output: 10

  # Unscored provider - no benchmark or dynamic data initially
  - check: "model_contains"
    value: "unscored-provider"
    response:
      type: "success"
      content: "Response from unscored provider"
      delay_seconds: 0.2
      tokens:
        input: 20
        output: 10

default_response:
  type: "success"
  content: "Default dynamic routing response"
  delay_seconds: 0.2
  tokens:
    input: 20
    output: 10
