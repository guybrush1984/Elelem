# Faker streaming provider configuration for testing Elelem's streaming collection
# This provider uses streaming by default (like Fireworks)
provider:
  endpoint: http://localhost:6666/v1
  default_params:
    stream: true  # Enable streaming by default like Fireworks
  max_tokens_default: 4096

models:
  # Model for testing streaming response collection
  "faker-streaming:streaming-test":
    provider: faker-streaming
    model_id: streaming-test
    capabilities:
      supports_json_mode: true
      supports_temperature: true
      supports_system: true
    cost:
      input_cost_per_1m: 0.12
      output_cost_per_1m: 0.35
      currency: USD

  # Slow streaming provider for min_tps testing
  "faker-streaming:slow-provider":
    provider: faker-streaming
    model_id: slow-provider
    capabilities:
      supports_json_mode: false
      supports_temperature: true
      supports_system: true
    cost:
      input_cost_per_1m: 0.10
      output_cost_per_1m: 0.30
      currency: USD

  # Medium streaming provider for min_tps testing
  "faker-streaming:medium-provider":
    provider: faker-streaming
    model_id: medium-provider
    capabilities:
      supports_json_mode: false
      supports_temperature: true
      supports_system: true
    cost:
      input_cost_per_1m: 0.15
      output_cost_per_1m: 0.40
      currency: USD

  # Fast streaming provider for min_tps testing
  "faker-streaming:fast-provider":
    provider: faker-streaming
    model_id: fast-provider
    capabilities:
      supports_json_mode: false
      supports_temperature: true
      supports_system: true
    cost:
      input_cost_per_1m: 0.20
      output_cost_per_1m: 0.50
      currency: USD