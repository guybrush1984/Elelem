      - model: "openai:openai/gpt-4.1"
        priority: always_last

  "virtual:deepseek-v3.1-terminus-cheap?reasoning":
    routing:
      speed_weight: 0.3
    candidates:
      - model: "virtual:deepseek-v3.1-terminus?reasoning"

  "virtual:deepseek-v3.1-terminus-quick?reasoning":
    routing:
      speed_weight: 2.0
    candidates:
      - model: "virtual:deepseek-v3.1-terminus?reasoning"

  # ===========================================================================
  # OPENAI GPT-OSS 20B (parameterized reasoning levels)
  # ===========================================================================

  "virtual:gpt-oss-20b?reasoning=@[low,medium,high]":
    metadata:
      model_reference: "openai_gpt_oss_20b"
    timeout: 120s
    candidates:
      - model: "gmi:openai/gpt-oss-20b?reasoning=$reasoning"
      - model: "deepinfra:openai/gpt-oss-20b?reasoning=$reasoning"
      - model: "novita:openai/gpt-oss-20b?reasoning=$reasoning"
      - model: "groq:openai/gpt-oss-20b?reasoning=$reasoning"
      - model: "vertex:openai/gpt-oss-20b?reasoning=$reasoning"
      # Fireworks excluded: streaming bug with large JSON responses
